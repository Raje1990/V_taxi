        Text('சிறப்புப் பயணச் சேவைகள்', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
        SizedBox(height: 10),
        Card(
          child: ListTile(
            leading: Icon(Icons.temple_hindu, color: Colors.deepOrange, size: 36),
            title: Text('ஆன்மீகப் பயணம் (Spiritual Trip)'),
            subtitle: Text('தஞ்சை பெரிய கோயில், புன்னைநல்லூர் மாரியம்மன் மற்றும் நவக்கிரக ஸ்தலங்கள் பயணம்.'),
          ),
        ),
        SizedBox(height: 10),
        Card(
          child: ListTile(
            leading: Icon(Icons.local_hospital, color: Colors.red, size: 36),
            title: Text('மருத்துவப் பயணம் (Medical Trip)'),
            subtitle: Text('மருத்துவமனை அவசரப் பயணங்கள் மற்றும் முதியோருக்கான சிறப்பு வாடகைச் சேவை.'),
          ),
        ),
      ],
    );
  }
}

